# Bachelor-Project Configuration
#
# Central place to switch models for ALL experiments in this folder
# (HiRAG, naive-RAG, streamlit_app). Edit the values here, or
# override per environment via the HIRAG_CHAT_MODEL / HIRAG_EMBEDDING_MODEL /
# HIRAG_MULTI_QUERY_MODEL environment variables.
#
# API keys are intentionally NOT stored here. They are read from the
# environment / src/app/.env-dev:
#   - AZURE_OPENAI_API_KEY  (api.central gateway key, used by HiRAG/basic-RAG)
#   - X_GATEWAY_API_KEY     (same gateway key, sent as X-Gateway-Api-Key)
#   - COHERE_API_KEY        (only needed when using hi_Search_cohere.py)

models:
  chat_model: "" # best_model_func (all stages except description summarization)
  cheap_model: "" # cheap_model_func (description summarization); empty = same as chat_model
  embedding_model: "" # Azure embedding deployment
  multi_query_model: "" # multi-query expansion model
  answer_generation: "" # answer model for the RAG models

# Per-stage model routing for HiRAG (only read by hi_Search_openai.py).
#
# Edit the models here to change which LLM each HiRAG stage uses;
# "stages" values are alias names looked up in
# "model_aliases" to get the real Azure gateway deployment name.
#
# use_stage_models: false -> original best/cheap split: best_model_func
#   uses models.chat_model, cheap_model_func uses models.cheap_model
#   (falls back to models.chat_model when cheap_model is empty).
# use_stage_models: true  -> stages listed below use their configured model;
#   any stage missing from "stages" falls back to its original model
#   function (best_model_func, or cheap_model_func for description
#   summarization).
stage_models:
  use_stage_models: true
  model_aliases:
    gpt-5.6-luna: "" # triplet/entity-relation extraction deployment
    gpt-5.6-terra: "" # chat/answer deployment
    gpt-5.6-sol: ""
    gpt-6-luna: ""
    gpt-6.1-terra: ""
    gpt-6.1-sol: ""
  stages:
    entity_extraction: gpt-6-luna
    relation_extraction: gpt-6-luna
    extraction_completeness_check: gpt-6-luna
    extraction_gleaning: gpt-6-luna
    description_summarization: gpt-6-luna
    cluster_summary: gpt-6-luna
    community_report: gpt-6-luna
    # answer_generation is NOT an indexing stage; it is configured
    # separately via models.answer_generation above.

# RAGAS evaluator (read by evaluation/score.py; CLI flags override).
# llm_model / embedding_model are gateway deployments. ragas_model_name is
# only the model-family name RAGAS uses internally (e.g. to pick reasoning-
# model parameters); the request always goes to llm_model.
# NOTE: keep ragas_model_name in the "gpt-<int>" form ("gpt-6", "gpt-5"):
# RAGAS detects reasoning models via int(model[4:]) and decimal variants like
# "gpt-6.1-sol" fail that parse, so max_tokens would NOT be mapped to
# max_completion_tokens and the gateway rejects the call with HTTP 400.
evaluation:
  llm_model: ""
  ragas_model_name: "gpt-6"
  embedding_model: ""
  max_tokens: 8192
  prompt_language: "english" # other values translate the RAGAS prompts first

# Azure OpenAI via the api.central gateway
openai:
  embedding_model: ""
  base_url: ""
  api_version: ""

# Optional non-Azure providers (no keys stored here; use env vars)
glm:
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  embedding_model: "embedding-3"

deepseek:
  base_url: "https://api.deepseek.com"

cohere:
  embedding_model: "embed-english-v3.0"
  embedding_dim: 1024

ollama:
  base_url: "http://localhost:11434"
  embedding_model: null
  chat_model: "rjmalagon/gte-qwen2-7b-instruct:f16"
  embedding_dim: 768

# Model Parameters
model_params:
  openai_embedding_dim: 1536
  glm_embedding_dim: 2048
  cohere_embedding_dim: 1024
  max_token_size: 8192

# HiRAG Configuration
hirag:
  working_dir: "./hirag_index_samples/hirag_index_sample_short_text"
  enable_llm_cache: true
  enable_hierachical_mode: true
  embedding_batch_num: 6
  embedding_func_max_async: 8
  enable_naive_rag: true
  static_random_seed: true
  neo4j_url: "neo4j://localhost:****"
  neo4j_auth: ["neo4j", "****"]
